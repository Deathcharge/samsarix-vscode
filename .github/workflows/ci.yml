name: Verify extension

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint release source
        run: npm run lint

      - name: Compile strict release source
        run: npm run compile

      - name: Run unit and release-surface tests
        run: npm test -- --runInBand

      - name: Audit production dependency surface
        run: npm run audit:prod

      - name: Build VSIX
        run: npm run package

      - name: Inspect built VSIX
        run: npm run inspect:package

      - name: Upload verified package and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: samsarix-vsix-${{ github.sha }}
          path: |
            dist/*.vsix
            dist/*.sha256
            dist/*.contents.txt
          if-no-files-found: error
          retention-days: 14

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        vscode-version: ["1.85.2", "stable"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Extension Development Host smoke test
        run: xvfb-run -a npm run test:integration
        env:
          SAMSARIX_VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
